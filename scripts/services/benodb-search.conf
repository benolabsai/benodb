# ---------------------------------------------------------
# BenoDB Search Node Configuration
# ---------------------------------------------------------
# This file is loaded by the systemd service (Linux) or 
# the launchd wrapper script (macOS). Uncomment and modify
# any of these values to configure the background service.

# --- Core Configuration ---
RUST_LOG=info
# BDB_SEARCH_BIND=127.0.0.1
# BDB_SEARCH_PORT=8080

# --- Qdrant API Configuration ---
BDB_QDRANT_BIND=0.0.0.0
BDB_QDRANT_PORT=6333

# --- Hardware / Performance ---
# BDB_SEARCH_DEVICE=auto          # Options: auto, cpu, cuda, wgpu
# RAYON_NUM_THREADS=8
# BDB_SEARCH_INDEX_CACHE_GB=4
# BDB_SEARCH_AUTO_REFRESH_SECS=5
# BDB_SEARCH_RRF_K=60

# --- Storage & WAL ---
# BDB_SEARCH_STORAGE_URI=file:///var/lib/benostreamdb/data
# BDB_SEARCH_WAL_DURABILITY=relaxed  # Options: relaxed, strict

# --- Catalog Configuration (Iceberg, etc.) ---
# BDB_SEARCH_CATALOG_TYPE=rest    # Options: rest, sql, glue, nessie
# BDB_SEARCH_CATALOG_URL=http://localhost:8181
# BDB_SEARCH_CATALOG_TOKEN=my-token
# BDB_SEARCH_CATALOG_CREDENTIAL=user:pass
# BDB_SEARCH_CATALOG_NAMESPACE=default
# BDB_SEARCH_CATALOG_PREFIX=
# BDB_SEARCH_CATALOG_ID=

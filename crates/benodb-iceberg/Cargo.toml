[package]
name = "benodb-iceberg"
version.workspace = true
edition = "2021"
license = "MIT AND Apache-2.0"
authors = ["Richard Albright and BenoDB Contributors"]
description = "Apache Iceberg format layer for BenoDB: table metadata, Avro manifests, schemas, transforms, values, delete files, and Puffin deletion vectors"

[dependencies]
anyhow = "1.0"
apache-avro = "0.17"
arrow = { version = "57.2.0" }
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.5"
chrono = "0.4"
futures = "0.3"
lazy_static = "1.4"
moka = { version = "0.12", features = ["future", "sync"] }
murmur3 = "0.5.2"
object_store = { version = "0.12.4", default-features = false }
once_cell = "1.19"
parquet = { version = "57.2.0", features = ["async", "object_store"] }
prometheus = "0.13"
roaring = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
tokio = { version = "1.36", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
zstd = "0.13"

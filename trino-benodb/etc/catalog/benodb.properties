connector.name=benodb
# The connector factory reads `benodb.warehouse`. Schemas are subdirectories of
# the warehouse, so `benodb.default.events` resolves to
# `<warehouse>/default/events`. The bucket below must exist on the endpoint named
# by `benodb.s3.endpoint`; the bundled compose stack creates it.
benodb.warehouse=s3://benodb/
benodb.s3.endpoint=http://rustfs:9000
benodb.s3.access-key=${TRINO_S3_ACCESS_KEY}
benodb.s3.secret-key=${TRINO_S3_SECRET_KEY}

name: Iceberg Interop (JVM)

# Cross-engine certification with *external writers/readers*: Apache Spark and
# Trino open tables written by BenoDB and assert the row set. This is the
# JVM counterpart to the Rust `apache/iceberg-rust` oracle that runs per-PR in
# `ci.yml`.
#
# Why not per-PR:
#   * a Spark submit costs a JVM start plus a ~200 MB Maven resolve of the
#     Iceberg runtime, and a Trino server needs ~40 s to become queryable;
#   * the JVM path only changes when the *table format* or the fixture changes,
#     which is exactly what the path filter below watches.
# The connector suites (`spark-benodb`, `trino-benodb`) still run on
# every PR in `ci.yml`; those test the connector, not the on-disk format.
#
# Version pins (verified against Maven Central):
#   * Apache Iceberg publishes `iceberg-spark-runtime` only for Spark minor
#     series 3.4, 3.5, 4.0 and 4.1 (each `_2.12` and `_2.13`). There is **no 4.2
#     runtime**, so Spark 4.2.x has no supported Iceberg pairing — do not pin it.
#   * 3.5.2 + `3.5_2.12` + Java 17 mirrors the connector matrix's Spark 3.5 lane.
#   * 4.0.x + `4.0_2.13` + Java 21 mirrors the connector matrix's Spark 4.0 lane.
#   * Iceberg 1.11 is used rather than 1.6: V3 deletion vectors and row lineage
#     need a recent runtime.

on:
  schedule:
    - cron: '0 8 * * 3' # Wednesdays 08:00 UTC
  workflow_dispatch:
  # Called by release.yml so a release commit carries its own interop result.
  # A workflow cannot depend on another workflow, and a tag push has no run to
  # wait for, so the only way to gate publication on interop is to run it
  # inside the release.
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/core/iceberg/**'
      - 'src/core/metadata.rs'
      - 'tests/test_cross_engine_compat.py'
      - 'tests/iceberg_rust_oracle/**'
      - '.github/workflows/iceberg-interop.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The interop assertions are mandatory here: a missing runtime must fail, not skip.
  BDB_REQUIRE_JVM_INTEROP: "1"

jobs:
  #########################
  # Spark reads BenoDB tables
  #########################
  spark-interop:
    name: Spark ${{ matrix.spark }} reads Iceberg
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.5.2"
            java: "17"
            packages: "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.11.0"
          - spark: "4.0.1"
            java: "21"
            packages: "org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.11.0"
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Vulkan
        # The wheel build links against Vulkan. A runner DNS blip while fetching
        # `libvulkan-dev` failed the first run of this workflow with
        # "Temporary failure resolving 'azure.archive.ubuntu.com'", so retry
        # rather than let infrastructure flakiness masquerade as a conformance
        # failure.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libvulkan1 libvulkan-dev && exit 0
            echo "apt attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Cache the Iceberg Spark runtime JAR
        uses: actions/cache@v6
        with:
          path: ~/.cache/benodb-iceberg-runtime
          key: iceberg-spark-runtime-${{ matrix.packages }}

      - name: Fetch the Iceberg Spark runtime JAR
        # `spark-submit --packages` resolves through Ivy. With a restored
        # `~/.ivy2/cache` the resolver answered from cache state and reported the
        # pinned artifact as missing without a single repository search
        # (`resolve 1455ms :: artifacts dl 0ms`, `search 0`), while Maven Central
        # served the same jar and its checksum. Fetching the pinned jar and
        # handing it to Spark with `--jars` removes Ivy from the critical path.
        run: |
          coord="${{ matrix.packages }}"
          group=$(printf '%s' "$coord" | cut -d: -f1 | tr . /)
          artifact=$(printf '%s' "$coord" | cut -d: -f2)
          version=$(printf '%s' "$coord" | cut -d: -f3)
          base="https://repo1.maven.org/maven2/$group/$artifact/$version"
          dir="$HOME/.cache/benodb-iceberg-runtime"
          jar="$dir/$artifact-$version.jar"
          if [ ! -s "$jar" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 \
              -o "$jar.part" "$base/$artifact-$version.jar"
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 \
              -o "$jar.sha1" "$base/$artifact-$version.jar.sha1"
            ( cd "$dir" && printf '%s  %s\n' "$(cat "$jar.sha1")" \
                "$(basename "$jar.part")" | sha1sum -c - )
            mv "$jar.part" "$jar"
          fi
          unzip -tq "$jar" > /dev/null
          echo "BDB_SPARK_ICEBERG_JAR=$jar" >> "$GITHUB_ENV"

      - name: Install maturin and build the Python bindings
        run: |
          pip install maturin
          maturin build --features python
          pip install "$(ls target/wheels/benodb-*.whl)[dev]"

      - name: Install PySpark ${{ matrix.spark }}
        run: pip install "pyspark==${{ matrix.spark }}" pandas pyarrow pytest

      - name: Spark reads a BenoDB table (V2 + V3 lineage)
        env:
          # `BDB_SPARK_ICEBERG_JAR` arrives from the fetch step via `$GITHUB_ENV`.
          # The coordinate stays exported for the `--packages` fallback the test
          # uses when no jar is supplied.
          BDB_SPARK_ICEBERG_PACKAGES: ${{ matrix.packages }}
        run: |
          pytest -v tests/test_cross_engine_compat.py -k "spark"

  #########################
  # Trino reads BenoDB tables
  #
  # Trino's Iceberg connector is configured with a `filesystem` catalog over the
  # same directory the fixtures are written to, which is why the test directory
  # is bind-mounted into the container at the identical path.
  #########################
  trino-interop:
    name: Trino ${{ matrix.trino }} reads Iceberg
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both bands the connector matrix certifies.
        trino: ["482", "484"]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Vulkan
        # Same runner-DNS retry as the Spark job; see the note there.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libvulkan1 libvulkan-dev && exit 0
            echo "apt attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Install maturin and build the Python bindings
        run: |
          pip install maturin
          maturin build --features python
          pip install "$(ls target/wheels/benodb-*.whl)[dev]"

      - name: Install the Trino client
        run: pip install trino pandas pyarrow pytest

      - name: Prepare the warehouse directory
        # The test creates and commits its own table in `setup_method`, so there is
        # no separate fixture to write here. The directory only has to exist before
        # it is bind-mounted into the Trino container, and the other suites need a
        # directory to write into as well.
        run: |
          mkdir -p /tmp/benodb_compat_tests
          pytest -v tests/test_cross_engine_compat.py -k "not spark and not trino" || true

      # Why a metastore and not Nessie: `CALL iceberg.system.register_table` is
      # rejected for Nessie catalogs with "registerTable is not supported for
      # Iceberg Nessie catalogs", and Trino 482 removed the `hadoop` catalog type
      # that used to read a directory without a metastore. hive_metastore is the
      # remaining catalog that supports registering an existing location.
      #
      # apache/hive ships no JDBC driver, so the Postgres driver is pinned by
      # version and mounted into /opt/hive/lib. Without it schematool exits with
      # ClassNotFoundException: org.postgresql.Driver and nothing ever listens.
      - name: Start the Hive metastore
        run: |
          curl -fsSL -o /tmp/postgresql-42.7.4.jar \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
          docker network create interop-net || true
          docker run -d --network interop-net --name metastore-db \
            -e POSTGRES_USER=hive -e POSTGRES_PASSWORD=hive -e POSTGRES_DB=metastore \
            postgres:16
          for i in $(seq 1 60); do
            docker exec metastore-db pg_isready -U hive >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --network interop-net --name metastore \
            -e SERVICE_NAME=metastore -e DB_DRIVER=postgres \
            -e SERVICE_OPTS="-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive -Dmetastore.warehouse.dir=/tmp/benodb_compat_tests" \
            -v /tmp/postgresql-42.7.4.jar:/opt/hive/lib/postgres.jar:ro \
            -v /tmp/benodb_compat_tests:/tmp/benodb_compat_tests \
            apache/hive:4.0.0
          for i in $(seq 1 90); do
            if docker exec metastore-db bash -c 'exec 3<>/dev/tcp/metastore/9083' 2>/dev/null; then
              echo "Metastore is up after ${i}s"
              break
            fi
            sleep 2
          done
          docker exec metastore-db bash -c 'exec 3<>/dev/tcp/metastore/9083' 2>/dev/null \
            || (docker logs metastore && exit 1)

      # Mount ONLY the catalog directory. Bind-mounting all of /etc/trino replaces
      # the image's jvm.config, node.properties and config.properties with an empty
      # directory, and the launcher exits before Trino ever listens.
      #
      # fs.hadoop.enabled is what gives the connector a filesystem factory for a
      # file: location; without it register_table fails with "No factory for
      # location: /tmp/.../metadata" and the table is silently never registered.
      - name: Start Trino ${{ matrix.trino }} with Iceberg catalog
        run: |
          mkdir -p /tmp/trino-etc/catalog
          cat > /tmp/trino-etc/catalog/iceberg.properties <<'EOF'
          connector.name=iceberg
          iceberg.catalog.type=hive_metastore
          hive.metastore.uri=thrift://metastore:9083
          fs.hadoop.enabled=true
          iceberg.register-table-procedure.enabled=true
          EOF
          docker run -d --network interop-net --name trino \
            -p 8080:8080 \
            -v /tmp/trino-etc/catalog:/etc/trino/catalog:ro \
            -v /tmp/benodb_compat_tests:/tmp/benodb_compat_tests \
            trinodb/trino:${{ matrix.trino }}
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/v1/info 2>/dev/null | grep -q '"starting":false'; then
              echo "Trino is up and ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/v1/info | grep -q '"starting":false' || (docker logs trino && docker logs metastore && exit 1)

      - name: Trino reads the BenoDB table
        env:
          TRINO_HOST: 127.0.0.1
          TRINO_PORT: "8080"
        run: pytest -v tests/test_cross_engine_compat.py -k "trino"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs trino || true
          docker logs metastore || true
